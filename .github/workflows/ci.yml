name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_DIR: services/api
  PY_DIR: services/model-server

jobs:
  # Cheap gate first: catches duplicate migrations and stale scaffolding before
  # the expensive suites spin up.
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No SQL duplicated outside db/migrations
        run: |
          set -euo pipefail
          stray=$(find . -name '*.sql' -not -path './db/migrations/*' -not -path './.git/*')
          if [ -n "$stray" ]; then
            echo "::error::db/migrations is the single source of truth; move these:" >&2
            echo "$stray" >&2
            exit 1
          fi
      - name: Migrations are not mounted into initdb
        run: |
          set -euo pipefail
          # Strip comments: docker-compose.yml documents *why* initdb is unused.
          if sed 's/#.*$//' docker-compose.yml | grep -q 'initdb\.d'; then
            echo "::error::the api owns schema_migrations; do not mount SQL into initdb.d" >&2
            exit 1
          fi
      - name: No hardcoded absolute paths from other machines
        run: |
          set -euo pipefail
          if grep -rnE '(^|[^A-Za-z0-9_])/(home|Users)/[a-z]' \
               --include='Makefile' --include='*.mk' --include='*.yml' --include='*.yaml' .; then
            echo "::error::absolute home paths from another machine leaked in" >&2
            exit 1
          fi
      - name: Shell + compose + k8s syntax
        run: |
          bash -n scripts/e2e_demo.sh
          python3 -c "import yaml,sys;[yaml.safe_load_all(open(f)) for f in ['docker-compose.yml','deploy/k8s/k8s.yaml','.github/workflows/ci.yml']];print('yaml ok')"

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/api/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      # -count=1: some tests assert on deploy/docker/Dockerfile.api and
      # db/migrations, which live outside the package, so editing them does not
      # invalidate Go's test cache and a stale result would be served instead.
      - run: go test -count=1 -race -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: services/api/coverage.out

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/model-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests -q --cov=app --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: services/model-server/.coverage

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pillow
      - name: Compile every Python file
        run: python -m compileall -q services/model-server ml scripts tests
      - name: Notebooks rebuild reproducibly
        run: |
          python ml/notebooks/build_notebooks.py
          git diff --exit-code -- ml/notebooks
      - name: Synthetic dataset is deterministic
        run: |
          python ml/data/make_synthetic_dataset.py --out /tmp/ds-a --n 40 >/dev/null
          python ml/data/make_synthetic_dataset.py --out /tmp/ds-b --n 40 >/dev/null
          diff -r /tmp/ds-a /tmp/ds-b

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: the e2e job below uses the runner's
      # own chromium via CHROME_PATH, so a ~400 MB download here is wasted.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npx vitest run --coverage
      - run: npm run build
      - name: The app bundle must not collide with the product-photo /assets route
        run: |
          set -euo pipefail
          if grep -qE '(src|href)="/assets/' dist/index.html; then
            echo "::error::Vite assetsDir must not be 'assets' — ASSET_PUBLIC_BASE_URL" >&2
            echo "::error::=/assets is served from the product-photo volume and would" >&2
            echo "::error::404 the bundle, rendering a blank page." >&2
            exit 1
          fi

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The committed notebooks match their builder
        run: |
          set -e
          python ml/notebooks/build_notebooks.py
          if ! git diff --quiet -- ml/notebooks/; then
            echo "::error::a notebook is out of date; run 'make notebooks' and commit the result"
            git --no-pager diff --stat -- ml/notebooks/
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/docker/Dockerfile.api -t catalogue-api .
      - run: docker build -f deploy/docker/Dockerfile.web -t catalogue-web .
      - name: Validate the nginx config we just baked in
        run: docker run --rm --add-host api:127.0.0.1 catalogue-web nginx -t
        # model image needs the full CUDA ML stack; built on GPU runners only.

  # The real proof: boot the whole stack and assert both product rules.
  e2e:
    runs-on: ubuntu-latest
    needs: [go, python, web, hygiene]
    env:
      # CI runners have no GPU, and the CUDA model image is ~3.8 GB.
      MODEL_DOCKERFILE: deploy/docker/Dockerfile.model-cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Boot the stack
        run: |
          docker compose up --build -d --wait --wait-timeout 420
      - name: Seed + assert the grounded-QA and editor-gate rules
        run: |
          python scripts/seed_demo.py --api-base http://localhost:8080 --no-images
          python -m pytest tests/integration -q
      - name: Browser contract tests (nginx proxy + both product gates in the UI)
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          BASE_URL=http://localhost:8081 \
          API_KEY=local-dev-admin-key \
          CHROME_PATH=/home/runner/.cache/ms-playwright/chromium-*/chrome-linux/chrome \
          npx playwright test
      - name: Publish the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Tear down
        if: always()
        run: docker compose down -v
