[project]
name = "catalogue-ai-model-server"
version = "1.0.0"
description = "Multimodal RAG + spec-to-description model server (FAISS, SBERT, CLIP, T5)"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.9.2",
  "numpy==1.26.4",
  "faiss-cpu==1.8.0.post1",
]

[project.optional-dependencies]
# GPU serving: torch + transformers + sentence-transformers + pillow
ml = [
  "torch==2.4.1",
  "transformers==4.44.2",
  "sentence-transformers==3.0.1",
  "pillow==10.4.0",
  "safetensors==0.4.5",
]
train = [
  "datasets==2.21.0",
  "evaluate==0.4.2",
  "sacrebleu==2.4.3",
  "rouge-score==0.1.2",
  "accelerate==0.34.2",
]
dev = [
  "pytest==8.3.3",
  "pytest-cov==5.0.0",
  "httpx==0.27.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
